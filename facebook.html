<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Number & Message Copy Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i data-lucide="copy-check" class="w-7 h-7"></i>
                <h1 class="text-xl font-bold tracking-tight">Bulk Number Copy Assistant</h1>
            </div>
            <div class="text-xs bg-indigo-700 font-medium px-3 py-1 rounded-full border border-indigo-500">
                Clipboard Tool Mode
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">

        <div id="setup-panel" class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-slate-200">
            <h2 class="text-lg font-semibold mb-4 flex items-center text-slate-800">
                <i data-lucide="sliders" class="w-5 h-5 mr-2 text-indigo-600"></i> Setup Campaign
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Phone Numbers Area -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Step 1: Paste Phone Numbers (Without Country Code)
                    </label>
                    <textarea id="numbersInput" class="w-full h-48 p-3.5 border border-slate-300 rounded-xl text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition" placeholder="01711000000&#10;01811000000&#10;01911000000"></textarea>
                    <p class="text-xs text-slate-500 mt-1">Paste one number per line (e.g. 01711223344).</p>
                </div>

                <!-- Message Text Area -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Step 2: Write Campaign Message
                    </label>
                    <textarea id="messageInput" class="w-full h-48 p-3.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none transition" placeholder="Write your text message here...">📢 আমাদের বিশেষ অফার চলছে!
আজই অর্ডার করুন এবং বুঝে নিন আকর্ষনীয় ছাড়।
বিস্তারিত জানতে ওয়েবসাইট ভিজিট করুন: https://example.com</textarea>
                    <p class="text-xs text-slate-500 mt-1">This message will be available for quick copying at the top.</p>
                </div>
            </div>

            <div class="mt-6 text-right">
                <button onclick="generateList()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-8 rounded-xl transition-all duration-200 shadow-md hover:shadow-lg inline-flex items-center ml-auto">
                    <i data-lucide="list" class="w-5 h-5 mr-2"></i> Generate Copy List
                </button>
            </div>
        </div>

        <div id="dashboard" class="hidden space-y-6">

            <!-- Top Large Message Copy Card (Sticky at top during scroll) -->
            <div class="sticky top-16 z-30 bg-indigo-900/95 backdrop-blur-md text-white rounded-2xl shadow-xl p-5 border border-indigo-700 transition-all">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex-1 min-w-0">
                        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-300 bg-indigo-800/80 px-3 py-0.5 rounded-full">Campaign Message</span>
                        <p id="messagePreview" class="text-slate-100 text-sm mt-2 line-clamp-2 italic font-sans whitespace-pre-wrap max-h-20 overflow-y-auto pr-2"></p>
                    </div>
                    <div class="w-full md:w-auto shrink-0">
                        <button id="copyMsgBtn" onclick="copyCampaignMessage()" class="w-full md:w-auto bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-3.5 px-8 rounded-xl shadow-md transition-all flex items-center justify-center text-base">
                            <i data-lucide="copy" class="w-5 h-5 mr-2"></i> Copy Full Message
                        </button>
                    </div>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-slate-500 text-xs font-medium uppercase tracking-wider">Total Numbers</p>
                        <p id="totalCount" class="text-2xl font-bold text-slate-800">0</p>
                    </div>
                    <div class="bg-slate-100 p-2.5 rounded-lg"><i data-lucide="hash" class="text-slate-600 w-5 h-5"></i></div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-slate-500 text-xs font-medium uppercase tracking-wider">Copied</p>
                        <p id="copiedCount" class="text-2xl font-bold text-emerald-600">0</p>
                    </div>
                    <div class="bg-emerald-100 p-2.5 rounded-lg"><i data-lucide="check-circle-2" class="text-emerald-600 w-5 h-5"></i></div>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-slate-500 text-xs font-medium uppercase tracking-wider">Remaining</p>
                        <p id="remainingCount" class="text-2xl font-bold text-amber-600">0</p>
                    </div>
                    <div class="bg-amber-100 p-2.5 rounded-lg"><i data-lucide="clock" class="text-amber-600 w-5 h-5"></i></div>
                </div>
            </div>

            <!-- Action Toolbar -->
            <div class="flex flex-wrap justify-between items-center gap-3 pt-2">
                <button onclick="backToSetup()" class="text-slate-600 hover:text-indigo-600 text-sm font-medium inline-flex items-center transition">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Edit Inputs / Back
                </button>
                <div class="space-x-2">
                    <button onclick="resetCopyStatus()" class="text-slate-500 hover:text-red-600 text-sm font-medium px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-red-50 transition">
                        Reset Copy Status
                    </button>
                </div>
            </div>

            <!-- Numbers List Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">#</th>
                                <th class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">Phone Number</th>
                                <th class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3.5 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="numbersTableBody" class="divide-y divide-slate-100">
                            <!-- Generated Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <script>
        let items = [];
        let campaignMessage = "";

        function refreshIcons() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                setTimeout(refreshIcons, 100);
            }
        }

        window.onload = () => {
            refreshIcons();
        };

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            let successful = false;
            try {
                successful = document.execCommand('copy');
            } catch (err) {
                console.error('Failed to copy', err);
            }
            document.body.removeChild(textarea);
            return successful;
        }

        function generateList() {
            const rawNumbers = document.getElementById('numbersInput').value;
            campaignMessage = document.getElementById('messageInput').value;

            if (!rawNumbers.trim()) {
                return;
            }

            const lines = rawNumbers.split('\n');
            items = lines
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .map((numberStr, index) => {
                    // Extract digits only to keep clean numbers without formatting
                    const cleaned = numberStr.replace(/[^0-9+]/g, '');
                    return {
                        id: index,
                        number: cleaned || numberStr,
                        copied: false
                    };
                });

            document.getElementById('messagePreview').innerText = campaignMessage || "(No message provided)";
            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            renderTable();
            updateStats();
        }

        function renderTable() {
            const tbody = document.getElementById('numbersTableBody');
            tbody.innerHTML = '';

            items.forEach((item) => {
                const tr = document.createElement('tr');
                tr.className = item.copied 
                    ? 'bg-emerald-50/70 transition-colors duration-300' 
                    : 'hover:bg-slate-50 transition-colors duration-200';

                const statusBadge = item.copied
                    ? `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800"><i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i> Copied</span>`
                    : `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">Pending</span>`;

                const btnHtml = item.copied
                    ? `<button disabled class="inline-flex items-center justify-center min-h-[46px] px-6 py-2.5 bg-slate-200 text-slate-400 text-sm font-bold rounded-xl cursor-not-allowed min-w-[150px]">
                        <i data-lucide="check-circle-2" class="w-5 h-5 mr-2"></i> Copied
                       </button>`
                    : `<button onclick="copyNumber(${item.id}, '${item.number}')" class="inline-flex items-center justify-center min-h-[46px] px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-bold rounded-xl shadow-md hover:shadow-lg transition-all duration-150 min-w-[150px] cursor-pointer">
                        <i data-lucide="copy" class="w-5 h-5 mr-2"></i> Copy Number
                       </button>`;

                tr.innerHTML = `
                    <td class="px-6 py-4 text-xs font-medium text-slate-400">${item.id + 1}</td>
                    <td class="px-6 py-4 text-base font-mono font-bold text-slate-900">${item.number}</td>
                    <td class="px-6 py-4">${statusBadge}</td>
                    <td class="px-6 py-4 text-right">${btnHtml}</td>
                `;

                tbody.appendChild(tr);
            });

            refreshIcons();
        }

        function copyNumber(id, number) {
            copyToClipboard(number);

            const index = items.findIndex(i => i.id === id);
            if (index !== -1) {
                items[index].copied = true;
                renderTable();
                updateStats();
            }
        }

        function copyCampaignMessage() {
            if (!campaignMessage) return;
            copyToClipboard(campaignMessage);

            const btn = document.getElementById('copyMsgBtn');
            const originalHtml = btn.innerHTML;

            btn.innerHTML = `<i data-lucide="check-check" class="w-5 h-5 mr-2"></i> Message Copied!`;
            btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
            btn.classList.add('bg-teal-600');
            refreshIcons();

            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.classList.remove('bg-teal-600');
                btn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                refreshIcons();
            }, 2000);
        }

        function updateStats() {
            const total = items.length;
            const copied = items.filter(i => i.copied).length;
            const remaining = total - copied;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('copiedCount').innerText = copied;
            document.getElementById('remainingCount').innerText = remaining;
        }

        function resetCopyStatus() {
            items.forEach(i => i.copied = false);
            renderTable();
            updateStats();
        }

        function backToSetup() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('setup-panel').classList.remove('hidden');
        }
    </script>
</body>
</html>
